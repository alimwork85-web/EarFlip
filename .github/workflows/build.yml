name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the in-box C# compiler
        shell: cmd
        run: build.cmd

      - name: Check the output
        shell: cmd
        run: |
          dir EarFlip.exe
          powershell -NoProfile -Command "$v=[System.Diagnostics.FileVersionInfo]::GetVersionInfo('EarFlip.exe'); Write-Host $v.FileVersion $v.CompanyName"

      - uses: actions/upload-artifact@v4
        with:
          name: EarFlip
          path: |
            EarFlip.exe
            EarFlip.ico

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EarFlip.exe
          generate_release_notes: true
